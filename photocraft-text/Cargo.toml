[package]
name = "photocraft-text"
description = "Photoshop text engine reimplementation: fonts, shaping, layout, EngineData"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lib]
name = "photocraft_text"
path = "src/lib.rs"

[features]
default = []

[dependencies]
thiserror = "2"
# Caret stops are grapheme clusters, not chars: a combining sequence or an
# emoji ZWJ family must move the caret once.
unicode-segmentation = "1.13"
photocraft-psd = { path = "../photocraft-psd" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "render"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
