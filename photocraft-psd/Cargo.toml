[package]
name = "photocraft-psd"
description = "Faithful, lossless reader and writer for Adobe Photoshop PSD (v1) and PSB (v2) files"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/photocraft"

[lib]
name = "photocraft_psd"
path = "src/lib.rs"

[features]
# Real-file corpus tests (opt-in). Fail when the corpus is missing.
corpus = []
default = []
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = "2"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[dev-dependencies]
proptest = "1"
photocraft-psd = { path = ".", features = ["testgen"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
